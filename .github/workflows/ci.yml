name: CI

# Direct pushes and pull request merges both arrive as a push to main.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  critical-paths:
    name: Critical paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
