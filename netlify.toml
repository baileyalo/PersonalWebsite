# Static export (Next.js output: 'export') — no server, no Next.js plugin
[build]
  command = "npm run build"
  publish = "out"

# Use Node 18 to match local / avoid build issues
[build.environment]
  NODE_VERSION = "18"
  # Skip @netlify/plugin-nextjs (for SSR); this site is static-only
  NETLIFY_NEXT_PLUGIN_SKIP = "1"
