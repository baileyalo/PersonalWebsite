# Static export (Next.js output: 'export') — no server, no Next.js plugin
# npm ci = clean install from lockfile (avoids cached Next 16 from previous builds)
[build]
  command = "npm ci && npm run build"
  publish = "out"

# Node 22 for Netlify (Agent Runners work best with 22+)
[build.environment]
  NODE_VERSION = "22"
  # Skip @netlify/plugin-nextjs (for SSR); this site is static-only
  NETLIFY_NEXT_PLUGIN_SKIP = "1"
