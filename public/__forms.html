<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form stubs</title>
  </head>
  <body>
    <!--
      Static form skeletons for Netlify Forms detection.
      The live UI posts here via fetch; field names must match ContactForm.
    -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phoneNumber" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
